<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1024">
  <style>
    .b { fill: #4b5cf5; }
    .t { fill: #4b5cf5; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
  </style>
  <!-- Haritech brand mark: motion disc with signal trail -->
  <g class="b">
    <circle cx="700" cy="398" r="158"/>
    <rect x="452" y="273" width="21" height="21" rx="10.5" transform="translate(-11,-11) none" display="none"/>
  </g>
  <!-- white cut-outs through the disc -->
  <g fill="#ffffff">
    <rect x="536" y="272" width="176" height="60" rx="30"/>
    <rect x="520" y="366" width="140" height="62" rx="31"/>
    <rect x="596" y="462" width="130" height="58" rx="29"/>
    <rect x="648" y="374" width="150" height="54" rx="27"/>
    <circle cx="821" cy="401" r="26"/>
  </g>
  <!-- signal trail drifting off the left edge -->
  <g class="b">
    <circle cx="452" cy="301" r="22"/>
    <rect x="486" y="272" width="106" height="59" rx="29.5"/>
    <circle cx="447" cy="405" r="33"/>
    <rect x="524" y="374" width="52" height="63" rx="31.5"/>
    <circle cx="479" cy="505" r="17"/>
    <rect x="511" y="488" width="78" height="37" rx="18.5"/>
  </g>
  <!-- wordmark -->
  <text class="t" x="640" y="700" font-size="88" text-anchor="middle" letter-spacing="8">HARITECH</text>
  <text class="t" x="640" y="779" font-size="52" text-anchor="middle" letter-spacing="12" font-weight="700">EXCLUSIVE BUSINESS</text>
</svg>
