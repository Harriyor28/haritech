<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — HARITECH</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0d2240;--navy-mid:#1a3a6b;--accent:#00e5b4;--accent-dark:#00b894;
  --bg:#060f1e;--surface:rgba(255,255,255,.04);--border:rgba(255,255,255,.09);
  --text:#e8edf5;--muted:rgba(255,255,255,.5);--danger:#f74f6b;
  --ease:cubic-bezier(.16,1,.3,1);
}
html,body{height:100%;font-family:'DM Sans',sans-serif}
body{
  background:var(--bg);color:var(--text);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:1rem;
  background-image:
    radial-gradient(ellipse at 20% 50%,rgba(0,229,180,.06) 0%,transparent 55%),
    radial-gradient(ellipse at 80% 20%,rgba(26,58,107,.12) 0%,transparent 50%);
}
/* Animated grid */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:55px 55px;pointer-events:none;
}
/* Orbs */
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;animation:orbF 14s ease-in-out infinite}
.orb1{width:400px;height:400px;background:rgba(0,229,180,.055);top:-10%;right:-5%}
.orb2{width:350px;height:350px;background:rgba(26,58,107,.1);bottom:-10%;left:-5%;animation-delay:5s;animation-direction:reverse}
@keyframes orbF{0%,100%{transform:translate(0,0)}40%{transform:translate(25px,-18px)}70%{transform:translate(-15px,12px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.card{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.09);
  border-radius:24px;
  padding:2.8rem 2.5rem;
  width:100%;max-width:420px;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  box-shadow:0 32px 80px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.05);
  animation:fadeUp .7s var(--ease) both;
  position:relative;z-index:1;
}

/* Logo */
.logo-wrap{display:flex;align-items:center;gap:.85rem;margin-bottom:2.4rem;justify-content:center}
.logo-icon{
  width:48px;height:48px;border-radius:13px;
  background:linear-gradient(135deg,var(--navy),var(--navy-mid));
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  box-shadow:0 6px 20px rgba(13,34,64,.35);
  font-family:'Syne',sans-serif;font-weight:800;color:white;font-size:1.2rem;
}
.logo-icon img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.logo-sub{font-size:.72rem;opacity:.45;font-weight:400;letter-spacing:.06em;text-transform:uppercase;margin-top:.15rem}

/* Heading */
.card-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.6rem;text-align:center;margin-bottom:.4rem}
.card-sub{text-align:center;color:var(--muted);font-size:.86rem;margin-bottom:2rem;line-height:1.6}

/* Form */
.field{margin-bottom:1.2rem}
.field label{display:block;font-size:.78rem;font-weight:700;color:rgba(255,255,255,.7);margin-bottom:.5rem;letter-spacing:.04em}
.input-wrap{position:relative}
.input-wrap i.field-icon{
  position:absolute;left:1rem;top:50%;transform:translateY(-50%);
  color:rgba(255,255,255,.25);font-size:.85rem;pointer-events:none;
  transition:color .25s;
}
.input-wrap input{
  width:100%;padding:.95rem 1rem .95rem 2.8rem;
  background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:12px;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:.9rem;
  outline:none;transition:all .25s;
  -webkit-text-fill-color:var(--text);
}
.input-wrap input:focus{
  border-color:var(--accent);background:rgba(255,255,255,.09);
  box-shadow:0 0 0 3px rgba(0,229,180,.12);
}
.input-wrap input:focus + .field-icon,
.input-wrap input:focus ~ .field-icon{color:var(--accent)}
.input-wrap .toggle-pw{
  position:absolute;right:1rem;top:50%;transform:translateY(-50%);
  background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;
  font-size:.85rem;padding:4px;transition:color .2s;
}
.input-wrap .toggle-pw:hover{color:var(--accent)}

/* Error */
.error-msg{
  background:rgba(247,79,107,.1);border:1px solid rgba(247,79,107,.25);
  color:var(--danger);border-radius:10px;padding:.8rem 1rem;
  font-size:.82rem;margin-bottom:1.2rem;display:none;
  align-items:center;gap:.6rem;
}
.error-msg.show{display:flex}

/* Submit */
.submit-btn{
  width:100%;padding:1.05rem;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:var(--navy);border:none;border-radius:50px;
  font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;
  cursor:pointer;transition:all .3s var(--ease);
  display:flex;align-items:center;justify-content:center;gap:.6rem;
  margin-top:.4rem;letter-spacing:.02em;
}
.submit-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,229,180,.35)}
.submit-btn:disabled{opacity:.65;cursor:not-allowed;transform:none}
.submit-btn .spinner{
  width:18px;height:18px;border:2.5px solid rgba(13,34,64,.25);
  border-top-color:var(--navy);border-radius:50%;
  animation:spin .7s linear infinite;display:none;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Footer note */
.card-footer{text-align:center;margin-top:1.8rem;font-size:.76rem;color:rgba(255,255,255,.3)}
.card-footer a{color:var(--accent);text-decoration:none;font-weight:600}
.card-footer a:hover{text-decoration:underline}

/* Shake animation for wrong password */
.card.shake{animation:shake .4s ease}
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="card" id="login-card">
  <!-- Logo -->
  <div class="logo-wrap">
    <div class="logo-icon" id="login-logo">H</div>
    <div>
      <div class="logo-text" id="login-brand">HARITECH</div>
      <div class="logo-sub">Admin Panel</div>
    </div>
  </div>

  <h1 class="card-title">Welcome back</h1>
  <p class="card-sub">Sign in to manage your website, products, orders and more.</p>

  <!-- Error message -->
  <div class="error-msg" id="error-msg">
    <i class="fas fa-exclamation-circle"></i>
    <span id="error-text">Incorrect username or password.</span>
  </div>

  <!-- Login form -->
  <form onsubmit="doLogin(event)">
    <div class="field">
      <label>Username</label>
      <div class="input-wrap">
        <input type="text" id="login-user" placeholder="admin" autocomplete="username" required>
        <i class="fas fa-user field-icon"></i>
      </div>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" required>
        <i class="fas fa-lock field-icon"></i>
        <button type="button" class="toggle-pw" onclick="togglePw()" id="pw-eye"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <button type="submit" class="submit-btn" id="submit-btn">
      <div class="spinner" id="spinner"></div>
      <i class="fas fa-sign-in-alt" id="submit-icon"></i>
      <span id="submit-label">Sign In</span>
    </button>
  </form>

  <div class="card-footer">
    Default credentials: <strong style="color:rgba(255,255,255,.5)">admin</strong> / <strong style="color:rgba(255,255,255,.5)">admin123</strong><br>
    Change password in <a href="admin-dashboard.html">Dashboard → Settings</a>
  </div>
</div>

<script>
// Load branding from localStorage
(function(){
  try{
    var logo = localStorage.getItem('haritechLogo');
    var st = JSON.parse(localStorage.getItem('haritechSettings') || '{}');
    var name = (st.siteName || 'HARITECH').split(' ')[0];
    var logoEl = document.getElementById('login-logo');
    var brandEl = document.getElementById('login-brand');
    if(brandEl) brandEl.textContent = name;
    if(logoEl){
      if(logo && logo.startsWith('data:image')){
        logoEl.innerHTML = '<img src="'+logo+'" alt="logo" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;">';
      } else {
        logoEl.textContent = name.charAt(0).toUpperCase();
      }
    }
  } catch(e){}
})();

// Redirect if already logged in
if(localStorage.getItem('haritechAdminLoggedIn') === '1'){
  window.location.href = 'admin-dashboard.html';
}

function togglePw(){
  var input = document.getElementById('login-pass');
  var icon  = document.getElementById('pw-eye').querySelector('i');
  if(input.type === 'password'){
    input.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'fas fa-eye';
  }
}

function doLogin(e){
  e.preventDefault();
  var user  = document.getElementById('login-user').value.trim();
  var pass  = document.getElementById('login-pass').value;
  var btn   = document.getElementById('submit-btn');
  var spin  = document.getElementById('spinner');
  var icon  = document.getElementById('submit-icon');
  var label = document.getElementById('submit-label');
  var err   = document.getElementById('error-msg');

  // Show loading state
  btn.disabled = true;
  spin.style.display = 'block';
  icon.style.display = 'none';
  label.textContent  = 'Signing in…';
  err.classList.remove('show');

  // Simulate network delay for UX
  setTimeout(function(){
    var storedPass = localStorage.getItem('haritechAdminPassword') || 'admin123';
    var storedUser = localStorage.getItem('haritechAdminUsername') || 'admin';

    if(user === storedUser && pass === storedPass){
      // Success
      localStorage.setItem('haritechAdminLoggedIn', '1');
      spin.style.display = 'none';
      icon.style.display = 'inline';
      icon.className = 'fas fa-check';
      label.textContent = 'Success!';
      btn.style.background = 'linear-gradient(135deg,#00e5b4,#00b894)';
      setTimeout(function(){ window.location.href = 'admin-dashboard.html'; }, 600);
    } else {
      // Failure
      btn.disabled = false;
      spin.style.display = 'none';
      icon.style.display = 'inline';
      icon.className = 'fas fa-sign-in-alt';
      label.textContent  = 'Sign In';
      document.getElementById('error-text').textContent = 'Incorrect username or password.';
      err.classList.add('show');
      // Shake card
      var card = document.getElementById('login-card');
      card.classList.add('shake');
      setTimeout(function(){ card.classList.remove('shake'); }, 500);
      // Clear password field
      document.getElementById('login-pass').value = '';
      document.getElementById('login-pass').focus();
    }
  }, 700);
}
</script>
</body>
</html>
